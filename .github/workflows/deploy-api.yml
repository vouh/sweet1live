name: Deploy API

# Deploys the FastAPI backend to your Ubuntu VPS.
# Only runs when backend code changes (or you click "Run workflow").
# Requires GitHub secrets — until those exist, this job exits with a clear skip message.

# Legacy non-Docker API deploy. Kept for rollback/reference, but manual-only so
# it cannot race the full-stack deploy-hetzner workflow on a push to main.
on:
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped — add GitHub secrets HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY (see docs/CI-CD.md). This is not a code bug."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        if: steps.secrets.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add VPS host key
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Pull, migrate, restart API
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          PORT="${PORT:-22}"
          USER="${USER:-deploy}"
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "${USER}@${HOST}" bash -s <<'EOF'
          set -euo pipefail
          APP_DIR="${APP_DIR:-/var/www/sweet1live}"
          cd "$APP_DIR"
          git fetch origin
          git reset --hard origin/main
          cd backend
          source .venv/bin/activate
          pip install -r requirements.txt
          if [ -f "$APP_DIR/.env.local" ]; then
            set -a
            # shellcheck disable=SC1091
            . "$APP_DIR/.env.local"
            set +a
          fi
          alembic upgrade head
          sudo systemctl restart sweet1live-api
          sudo systemctl is-active sweet1live-api
          sleep 2
          curl -fsS http://127.0.0.1:8000/health
          echo
          echo "API deploy OK"
          EOF
